<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDRTerm — ADS-B 3D globe</title>
<link rel="stylesheet"
      href="https://cesium.com/downloads/cesiumjs/releases/1.117/Build/Cesium/Widgets/widgets.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%;
               background: #000; color: #eee; font: 14px system-ui, sans-serif; }
  #globe { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #hud {
    position: absolute; top: 0.6em; left: 0.6em; z-index: 1000;
    background: rgba(20, 20, 20, 0.9); color: #eee;
    padding: 0.6em 0.9em; border-radius: 6px;
    font-family: monospace; font-size: 12px; line-height: 1.5;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  #hud b { color: #8cf; }
  #hud select, #hud input, #hud button {
    background: #222; color: #eee; border: 1px solid #444;
    padding: 3px 6px; font-family: monospace; font-size: 12px;
    border-radius: 3px;
  }
  #hud button { cursor: pointer; }
  #hud button:hover { background: #333; }
  #hud button:disabled { opacity: 0.5; cursor: wait; }
  #custom-range { display: none; margin-top: 4px; }
  #custom-range input { width: 12em; }
  #window-label { color: #aaa; }
  #farthest.clickable {
    cursor: pointer; color: #8cf; text-decoration: underline dotted;
  }
  #farthest.clickable:hover { color: #fff; text-decoration: underline; }

  /* Cesium InfoBox theming — the box that appears when you click an entity */
  .cesium-infoBox { background: rgba(20, 20, 20, 0.95); color: #eee; }
  .cesium-infoBox-title { color: #8cf; }
  .cesium-infoBox-iframe { background: #1a1a1a; }
  /* Portrait viewports (phone held upright) — the default top-right
     InfoBox hides the plane you just tapped.  Reposition to bottom-left
     and cap height so the map stays usable behind it. */
  @media (orientation: portrait) {
    .cesium-infoBox {
      top:    auto  !important;
      right:  auto  !important;
      bottom: 0.6em !important;
      left:   0.6em !important;
      max-width:  calc(100vw - 1.2em) !important;
      max-height: 45vh              !important;
      width:      calc(100vw - 1.2em) !important;
    }
    /* HUD is top-left; on portrait shrink so both panels fit the
       narrow screen without one overlapping the other. */
    #hud { max-width: calc(100vw - 1.2em); font-size: 11px; }
  }
</style>
</head>
<body>
<div id="globe"></div>
<div id="hud">
  <div>
    <b>Show:</b>
    <select id="window-select">
      <option value="5m">last 5 minutes</option>
      <option value="30m" selected>last 30 minutes</option>
      <option value="1h">last 1 hour</option>
      <option value="2h">last 2 hours</option>
      <option value="6h">last 6 hours</option>
      <option value="today">today</option>
      <option value="custom">custom range…</option>
    </select>
    <button id="refresh-btn" title="Re-scan the log with the current window">↻</button>
  </div>
  <div id="custom-range">
    <div>from <input type="datetime-local" id="range-from" step="1"></div>
    <div>to&nbsp;&nbsp;<input type="datetime-local" id="range-to"   step="1"></div>
  </div>
  <div style="margin-top:6px">
    <b>Aircraft:</b> <span id="ac-count">0</span>
    &nbsp;<b>Log:</b> <span id="log-state">?</span>
  </div>
  <div><b>Farthest:</b> <span id="farthest">—</span></div>
  <div><b>Window:</b> <span id="window-label">—</span></div>
  <div><b>Tiles:</b> <span id="tiles-label">—</span></div>
</div>

<!-- Cesium needs its worker/asset base URL set BEFORE the main script loads. -->
<script>
  window.CESIUM_BASE_URL =
    'https://cesium.com/downloads/cesiumjs/releases/1.117/Build/Cesium/';
</script>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.117/Build/Cesium/Cesium.js"></script>
<script>
  // Cesium Ion access: not set. All imagery + terrain below uses free
  // public providers, so no Ion account is needed. If you want Cesium's
  // premium tiles/terrain, sign up at https://ion.cesium.com and set:
  //   Cesium.Ion.defaultAccessToken = '<your token>';

  // Placeholder imagery layer — replaced on the first refresh() with
  // whatever the plugin advertises via /api/adsb's `web_tiles` field.
  const _placeholderProvider = new Cesium.UrlTemplateImageryProvider({
    url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    subdomains: 'abcd',
    credit: '© OpenStreetMap © CARTO',
    maximumLevel: 19,
  });
  const viewer = new Cesium.Viewer('globe', {
    baseLayer: Cesium.ImageryLayer.fromProviderAsync(Promise.resolve(_placeholderProvider)),
    terrainProvider: new Cesium.EllipsoidTerrainProvider(),
    animation:            false,
    timeline:             false,
    baseLayerPicker:      false,
    fullscreenButton:     false,
    geocoder:             false,
    homeButton:           false,
    sceneModePicker:      false,
    navigationHelpButton: false,
    selectionIndicator:   true,
    infoBox:              true,
  });

  // Enable atmosphere / lighting — makes the sphere feel like a globe.
  viewer.scene.globe.enableLighting = false;
  viewer.scene.globe.showGroundAtmosphere = true;
  viewer.scene.skyAtmosphere.show = true;
  // Kill the giant Cesium credit block bottom-right so we can see the map.
  viewer.cesiumWidget.creditContainer.style.display = 'none';

  // Initial camera view over Europe (ADS-B is most productive at mid-lats).
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(10, 52, 5_000_000),
    duration: 0,
  });

  // ── unit conversion helpers ──────────────────────────────────────────
  const M_PER_FT   = 0.3048;
  const KMH_PER_KT = 1.852;
  const MS_PER_FPM = 0.00508;
  const NM_PER_KM  = 0.539957;
  const fmtAlt   = ft  => ft  == null ? '' : `${ft} ft / ${Math.round(ft * M_PER_FT)} m`;
  const fmtSpeed = kt  => kt  == null ? '' : `${kt} kt / ${Math.round(kt * KMH_PER_KT)} km/h`;
  const fmtVR    = fpm => fpm == null ? '' : `${fpm} fpm / ${(fpm * MS_PER_FPM).toFixed(1)} m/s`;
  const fmtDist  = km  => km  == null ? '' : `${km} km / ${(km * NM_PER_KM).toFixed(0)} nm`;

  function fmtLastSeen(ts) {
    if (ts == null) return '';
    const d = new Date(ts * 1000);       // ts is unix seconds (UTC)
    const iso = d.toISOString().substring(0, 19).replace('T', ' ');
    const ago = Math.max(0, (Date.now() / 1000 - ts));
    let human;
    if      (ago < 60)     human = `${Math.round(ago)}s ago`;
    else if (ago < 3600)   human = `${Math.round(ago / 60)}m ago`;
    else if (ago < 86400)  human = `${(ago / 3600).toFixed(1)}h ago`;
    else                   human = `${(ago / 86400).toFixed(1)}d ago`;
    return `${iso}Z (${human})`;
  }

  // Aircraft is considered stale (icon fades to grey) after this many
  // seconds of silence since the last decoded position frame.
  const STALE_SEC = 5 * 60;

  // Plane silhouette — same shape as the retired SVG billboard (16
  // vertices tracing fuselage + wings + tail stabilisers), but rendered
  // as a Cesium polygon lying tangent to the sphere so it *tilts with
  // the globe* in 3D.  Coords are in the SVG's original 24×24 viewBox;
  // planePolygonPositions() below translates them to metres in the
  // local ENU frame at each aircraft's position.  Cesium handles the
  // ~16 vertices per plane × ~few dozen planes trivially.
  const PLANE_SVG_VERTS = [
    [12,  1], [13,  9], [22, 13], [22, 15], [13, 13],
    [13, 19], [15, 21], [15, 22], [12, 21], [ 9, 22],
    [ 9, 21], [11, 19], [11, 13], [ 2, 15], [ 2, 13], [11,  9],
  ];
  const PLANE_SVG_CX = 12;    // SVG centre X
  const PLANE_SVG_CY = 12;    // SVG centre Y
  const PLANE_SCALE_M = 250;  // metres per SVG unit → wingspan 5 km, length ~5.5 km

  // Compute ECEF vertices of the plane-silhouette polygon for a given
  // (lat, lon, alt) + heading.  Uses the local East-North-Up frame so
  // the polygon lies flat on the tangent plane at that position — that's
  // why the whole silhouette tilts correctly when the globe is rotated
  // in 3D.  Heading rotates the shape in the tangent plane.
  function planePolygonPositions(lat, lon, alt_m, headingDeg) {
    const center = Cesium.Cartesian3.fromDegrees(lon, lat, alt_m);
    const enu    = Cesium.Transforms.eastNorthUpToFixedFrame(center);
    const hRad   = Cesium.Math.toRadians(headingDeg);
    const sH     = Math.sin(hRad), cH = Math.cos(hRad);
    return PLANE_SVG_VERTS.map(([svgX, svgY]) => {
      // (right, forward) in metres — SVG y grows downward, so
      // "forward" (toward north for a plane at heading 0) is -svgY.
      const right   = (svgX - PLANE_SVG_CX) * PLANE_SCALE_M;
      const forward = (PLANE_SVG_CY - svgY) * PLANE_SCALE_M;
      // Rotate (right, forward) by heading into (east, north)
      const east  = forward * sH + right * cH;
      const north = forward * cH - right * sH;
      return Cesium.Matrix4.multiplyByPoint(
        enu, new Cesium.Cartesian3(east, north, 0),
        new Cesium.Cartesian3(),
      );
    });
  }

  // ── enrichment cache (localStorage + memory mirror) ──────────────────
  const TTL = { aircraft: 24*60*60*1000, route: 6*60*60*1000, negative: 60*60*1000 };
  const cacheMem = { aircraft: {}, route: {} };
  function cacheGet(kind, key) {
    if (cacheMem[kind][key] !== undefined) return cacheMem[kind][key];
    try {
      const raw = localStorage.getItem(`adsb:${kind}:${key}`);
      if (!raw) return undefined;
      const { t, v, neg } = JSON.parse(raw);
      const ttl = neg ? TTL.negative : TTL[kind];
      if (Date.now() - t > ttl) { localStorage.removeItem(`adsb:${kind}:${key}`); return undefined; }
      cacheMem[kind][key] = v;
      return v;
    } catch { return undefined; }
  }
  function cacheSet(kind, key, value) {
    cacheMem[kind][key] = value;
    try {
      localStorage.setItem(`adsb:${kind}:${key}`,
        JSON.stringify({ t: Date.now(), v: value, neg: value === null }));
    } catch {}
  }
  async function fetchAircraft(icao) {
    const cached = cacheGet('aircraft', icao);
    if (cached !== undefined) return cached;
    try {
      const r = await fetch(`https://api.adsbdb.com/v0/aircraft/${icao}`);
      if (r.status === 404) { cacheSet('aircraft', icao, null); return null; }
      if (!r.ok) return null;
      const j = await r.json();
      const a = j?.response?.aircraft || null;
      cacheSet('aircraft', icao, a);
      return a;
    } catch { return null; }
  }
  async function fetchRoute(callsign) {
    const key = callsign.trim().toUpperCase();
    if (!key) return null;
    const cached = cacheGet('route', key);
    if (cached !== undefined) return cached;
    try {
      const r = await fetch(`https://api.adsbdb.com/v0/callsign/${key}`);
      if (r.status === 404) { cacheSet('route', key, null); return null; }
      if (!r.ok) return null;
      const j = await r.json();
      const fr = j?.response?.flightroute || null;
      cacheSet('route', key, fr);
      return fr;
    } catch { return null; }
  }

  // ── HTML for the InfoBox that Cesium opens on entity click ───────────
  function popupHtml(ac) {
    const acInfo = cacheGet('aircraft', ac.icao);
    const route  = ac.callsign ? cacheGet('route', ac.callsign.trim().toUpperCase()) : undefined;
    const parts = [];

    // Cesium's InfoBox already renders the entity's name as the title,
    // so we don't repeat it here — go straight to the photo/type/route.
    if (acInfo?.url_photo_thumbnail) {
      parts.push(`<a href="${acInfo.url_photo}" target="_blank" rel="noopener">
                    <img src="${acInfo.url_photo_thumbnail}" alt="aircraft photo"
                         style="max-width:240px;border-radius:4px" loading="lazy">
                  </a>`);
    }
    if (acInfo) {
      const typeLine = [acInfo.manufacturer, acInfo.type].filter(Boolean).join(' ');
      if (typeLine) parts.push(`<div><b>${typeLine}</b></div>`);
      if (acInfo.registration)    parts.push(`<div>Reg: <b>${acInfo.registration}</b></div>`);
      if (acInfo.registered_owner) parts.push(`<div>${acInfo.registered_owner}</div>`);
    } else if (acInfo === null) {
      parts.push('<div style="color:#888;font-size:11px">no metadata for this ICAO</div>');
    } else {
      parts.push('<div style="color:#888;font-style:italic">looking up aircraft…</div>');
    }
    if (route) {
      const o = route.origin, d = route.destination;
      if (o && d && o.latitude != null && d.latitude != null) {
        parts.push(
          `<div style="color:#f88;font-weight:bold;margin-top:0.4em">${o.iata_code || o.icao_code} → ${d.iata_code || d.icao_code}</div>`
          + `<div style="color:#aaa;font-size:11px">${o.municipality} → ${d.municipality}</div>`
        );
      }
      if (route.airline?.name) parts.push(`<div style="color:#aaa;font-size:11px">${route.airline.name}</div>`);
    } else if (route === null && ac.callsign) {
      parts.push('<div style="color:#888;font-size:11px">no route for this callsign (adsbdb 404)</div>');
    } else if (ac.callsign) {
      parts.push('<div style="color:#888;font-style:italic">looking up route…</div>');
    }

    const t = [];
    if (ac.alt         != null) t.push(`ALT ${fmtAlt(ac.alt)}`);
    if (ac.speed       != null) t.push(`SPD ${fmtSpeed(ac.speed)} (${ac.spd_type || '?'})`);
    if (ac.heading     != null) t.push(`HDG ${ac.heading}°`);
    if (ac.vr          != null) t.push(`V/S ${fmtVR(ac.vr)}`);
    if (ac.lat         != null) t.push(`POS ${ac.lat.toFixed(4)}, ${ac.lon.toFixed(4)}`);
    if (ac.distance_km     != null) t.push(`RNG ${fmtDist(ac.distance_km)}`);
    if (ac.max_distance_km != null && ac.max_distance_km !== ac.distance_km)
                                    t.push(`MAX RNG ${fmtDist(ac.max_distance_km)} in window`);
    if (ac.last_seen       != null) t.push(`SEEN ${fmtLastSeen(ac.last_seen)}`);
    if (t.length) parts.push(
      `<div style="font-family:monospace;font-size:11px;color:#ccc;margin-top:0.5em">
         ${t.join('<br>')}
       </div>`
    );

    parts.push(
      `<div style="font-size:10px;color:#666;margin-top:0.6em">
        data © <a href="https://www.adsbdb.com" target="_blank" rel="noopener" style="color:#666">adsbdb.com</a>
       </div>`
    );

    return parts.join('');
  }

  // ── swappable basemap ────────────────────────────────────────────────
  // Track the current tile URL so we only rebuild the imagery layer when
  // the plugin advertises a different provider (via preset).  This keeps
  // Cesium's tile cache intact across every refresh call.
  let currentTileUrl = null;
  let currentTileLayer = viewer.imageryLayers.get(0);

  function ensureTilesMatch(spec) {
    if (!spec || !spec.url || spec.url === currentTileUrl) return;
    const provider = new Cesium.UrlTemplateImageryProvider({
      url:          spec.url,
      subdomains:   spec.subdomains || undefined,
      credit:       spec.credit || '',
      maximumLevel: spec.max_zoom || 19,
    });
    // Insert new layer FIRST, then remove the old one — otherwise there's
    // a visible white flash between removal and add.
    const newLayer = viewer.imageryLayers.addImageryProvider(provider, 0);
    if (currentTileLayer) viewer.imageryLayers.remove(currentTileLayer);
    currentTileLayer = newLayer;
    currentTileUrl = spec.url;
  }

  // ── entity containers ────────────────────────────────────────────────
  // Aircraft + tracks live in one data source (easy bulk clear);
  // routes live in another (independent lifecycle per selection);
  // receiver pin has its own so it survives refresh cycles.
  const acDS       = new Cesium.CustomDataSource('aircraft');
  const routeDS    = new Cesium.CustomDataSource('route');
  const receiverDS = new Cesium.CustomDataSource('receiver');
  viewer.dataSources.add(acDS);
  viewer.dataSources.add(routeDS);
  viewer.dataSources.add(receiverDS);

  function drawReceiver(rx) {
    receiverDS.entities.removeAll();
    if (!rx) return;
    receiverDS.entities.add({
      id: '__receiver__',
      position: Cesium.Cartesian3.fromDegrees(rx.lon, rx.lat, 0),
      point: {
        pixelSize: 12,
        color: Cesium.Color.LIME,
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 2,
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
      },
      label: {
        text: 'RX',
        font: 'bold 11px monospace',
        fillColor: Cesium.Color.LIME,
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 3,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        verticalOrigin: Cesium.VerticalOrigin.TOP,
        pixelOffset: new Cesium.Cartesian2(0, 8),
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
      },
      description:
        `<div style="font-family:monospace">
           Receiver antenna<br>
           ${rx.lat.toFixed(6)}, ${rx.lon.toFixed(6)}
         </div>`,
    });
  }

  // Map ICAO → { latestAc, entity } so we can reach entities from
  // events (selection change) and update descriptions after enrichment.
  const acData = {};

  function clearAll() {
    acDS.entities.removeAll();
    routeDS.entities.removeAll();
    Object.keys(acData).forEach(k => delete acData[k]);
    // NB: don't reset boundsFitted here — user might have panned/zoomed
    // manually since first fit; only the initial refresh should fit.
  }

  function clearRoute() { routeDS.entities.removeAll(); }

  function drawRoute(route, currentPos) {
    clearRoute();
    if (!route?.origin || !route?.destination) return;
    const o = route.origin, d = route.destination;
    if (o.latitude == null || d.latitude == null) return;
    const destPos = Cesium.Cartesian3.fromDegrees(d.longitude, d.latitude, 0);
    // Dashed geodesic from plane → destination (great-circle, actually curved on the sphere).
    routeDS.entities.add({
      polyline: {
        positions: [currentPos, destPos],
        width: 3,
        material: new Cesium.PolylineDashMaterialProperty({
          color: Cesium.Color.fromCssColorString('#e33'),
          dashLength: 20,
        }),
        arcType: Cesium.ArcType.GEODESIC,
        clampToGround: false,
      },
    });
    // Airport dots with labels — origin AND destination both marked, no line to origin.
    for (const [ap, label] of [[o, o.iata_code || o.icao_code], [d, d.iata_code || d.icao_code]]) {
      routeDS.entities.add({
        position: Cesium.Cartesian3.fromDegrees(ap.longitude, ap.latitude, 0),
        point: {
          pixelSize: 10,
          color: Cesium.Color.fromCssColorString('#e33'),
          outlineColor: Cesium.Color.WHITE,
          outlineWidth: 2,
          disableDepthTestDistance: Number.POSITIVE_INFINITY,
        },
        label: {
          text: label,
          font: '12px monospace',
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 2,
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          pixelOffset: new Cesium.Cartesian2(0, -18),
          disableDepthTestDistance: Number.POSITIVE_INFINITY,
        },
      });
    }
  }

  // ── aircraft rendering ───────────────────────────────────────────────
  function renderAircraft(list) {
    for (const ac of list) {
      if (ac.lat == null || ac.lon == null) continue;
      // Use real altitude — this is Cesium's payoff: planes float above the globe.
      const alt_m = (ac.alt != null ? ac.alt * M_PER_FT : 8000);
      const pos = Cesium.Cartesian3.fromDegrees(ac.lon, ac.lat, alt_m);

      const isStale = ac.last_seen && (Date.now() / 1000 - ac.last_seen) > STALE_SEC;
      const heading = ac.heading != null ? ac.heading : 0;

      const entity = acDS.entities.add({
        id: ac.icao,
        name: ac.callsign || ac.icao,
        position: pos,
        polygon: {
          // Tangent-to-sphere plane arrow — replaces the earlier
          // screen-space billboard so the icon tilts with the globe.
          hierarchy: planePolygonPositions(ac.lat, ac.lon, alt_m, heading),
          material: (isStale
            ? Cesium.Color.fromCssColorString('#999').withAlpha(0.75)
            : Cesium.Color.fromCssColorString('#daa520').withAlpha(0.95)),   // goldenrod

          perPositionHeight: true,
          outline: false,       // WebGL polygon outlines are 1 px only
        },
        label: {
          text: ac.callsign || ac.icao,
          font: '11px monospace',
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 2,
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          pixelOffset: new Cesium.Cartesian2(0, -18),
          disableDepthTestDistance: Number.POSITIVE_INFINITY,
        },
        description: popupHtml(ac),
      });

      // Full-window track: connects every point in ac.track at its own altitude.
      // On a sphere this reads clearly as a 3D trail through the sky.
      let trackEntity = null;
      if (Array.isArray(ac.track) && ac.track.length > 1) {
        const positions = ac.track.map(p =>
          Cesium.Cartesian3.fromDegrees(p.lon, p.lat, (p.alt != null ? p.alt * M_PER_FT : 8000)));
        // Append the current position if it's newer than the last track sample
        const cur = ac.track[ac.track.length - 1];
        if (cur.lat !== ac.lat || cur.lon !== ac.lon) positions.push(pos);
        trackEntity = acDS.entities.add({
          polyline: {
            positions,
            width: TRACK_WIDTH,
            material: TRACK_COLOR,
            arcType: Cesium.ArcType.GEODESIC,
          },
        });
      }

      acData[ac.icao] = { latestAc: ac, entity, trackEntity };
    }
  }

  // Track styling — orange for unselected planes, red + thicker for the
  // currently-selected one so the highlighted aircraft's path pops out.
  const TRACK_COLOR       = Cesium.Color.ORANGE.withAlpha(0.75);
  const TRACK_WIDTH       = 2;
  const TRACK_SEL_COLOR   = Cesium.Color.fromCssColorString('#e33').withAlpha(0.95);
  const TRACK_SEL_WIDTH   = 4;

  function setTrackHighlight(icao, highlighted) {
    const rec = acData[icao];
    if (!rec || !rec.trackEntity) return;
    rec.trackEntity.polyline.material = highlighted ? TRACK_SEL_COLOR : TRACK_COLOR;
    rec.trackEntity.polyline.width    = highlighted ? TRACK_SEL_WIDTH : TRACK_WIDTH;
  }

  // ── selection & enrichment ───────────────────────────────────────────
  async function enrichOnOpen(icao) {
    const rec = acData[icao];
    if (!rec) return;
    const ac = rec.latestAc;
    const [_ac, route] = await Promise.all([
      cacheGet('aircraft', icao) !== undefined
        ? Promise.resolve(cacheGet('aircraft', icao))
        : fetchAircraft(icao),
      ac.callsign
        ? (cacheGet('route', ac.callsign.trim().toUpperCase()) !== undefined
            ? Promise.resolve(cacheGet('route', ac.callsign.trim().toUpperCase()))
            : fetchRoute(ac.callsign))
        : Promise.resolve(null),
    ]);
    // Rebuild the InfoBox HTML if this entity is still the selected one.
    if (viewer.selectedEntity === rec.entity) {
      rec.entity.description = popupHtml(ac);
      if (route && ac.lat != null) {
        const alt_m = (ac.alt != null ? ac.alt * M_PER_FT : 8000);
        drawRoute(route, Cesium.Cartesian3.fromDegrees(ac.lon, ac.lat, alt_m));
      }
    }
  }

  viewer.selectedEntityChanged.addEventListener(sel => {
    const selId = sel && acData[sel.id] ? sel.id : null;
    // Repaint every track so the current selection is the only red one.
    // O(n) per change; n is at most a few hundred — trivially fast.
    for (const icao in acData) setTrackHighlight(icao, icao === selId);

    if (selId) {
      try { localStorage.setItem('adsb:selected', selId); } catch {}
      enrichOnOpen(selId);
    } else {
      try { localStorage.removeItem('adsb:selected'); } catch {}
      clearRoute();
    }
  });

  // ── camera fit + selection restore ───────────────────────────────────
  // Fit fires only on the very first render (the user is in charge of
  // pan/zoom after that).  Selection restore fires on EVERY refresh so
  // that clicking ↻ keeps whichever plane is currently open selected
  // — as long as it's still in the returned data set.
  let boundsFitted = false;
  function fitToAircraft() {
    if (boundsFitted) return;
    const entities = acDS.entities.values;
    if (entities.length === 0) return;
    boundsFitted = true;
    // flyTo on a data source zooms to the collective bounding sphere.
    viewer.flyTo(acDS, { duration: 1.2, offset: new Cesium.HeadingPitchRange(0, -0.9, 0) });
  }
  function restoreSelection() {
    let saved = null;
    try { saved = localStorage.getItem('adsb:selected'); } catch {}
    if (!saved) return;
    const entity = acDS.entities.getById(saved);
    if (entity) viewer.selectedEntity = entity;
  }

  // ── time-window controls ─────────────────────────────────────────────
  function computeWindow(preset) {
    const now = new Date();
    const toIso = now.toISOString();
    let fromIso = null;
    switch (preset) {
      case '5m':    fromIso = new Date(now -   5 * 60 * 1000).toISOString(); break;
      case '30m':   fromIso = new Date(now -  30 * 60 * 1000).toISOString(); break;
      case '1h':    fromIso = new Date(now -  60 * 60 * 1000).toISOString(); break;
      case '2h':    fromIso = new Date(now - 120 * 60 * 1000).toISOString(); break;
      case '6h':    fromIso = new Date(now - 360 * 60 * 1000).toISOString(); break;
      case 'today': {
        const t = new Date(now); t.setHours(0, 0, 0, 0);
        fromIso = t.toISOString();
        break;
      }
      case 'custom': {
        const f = document.getElementById('range-from').value;
        const t = document.getElementById('range-to').value;
        return {
          from: f ? new Date(f).toISOString() : null,
          to:   t ? new Date(t).toISOString() : null,
        };
      }
    }
    return { from: fromIso, to: toIso };
  }

  function humanWindow(win) {
    const f = (win.from || '—').substring(0, 19).replace('T', ' ');
    const t = (win.to   || 'now').substring(0, 19).replace('T', ' ');
    return `${f}Z → ${t}${win.to ? 'Z' : ''}`;
  }

  async function refresh() {
    const btn = document.getElementById('refresh-btn');
    btn.disabled = true;
    try {
      const preset = document.getElementById('window-select').value;
      const w = computeWindow(preset);
      const p = new URLSearchParams();
      if (w.from) p.set('from', w.from);
      if (w.to)   p.set('to',   w.to);
      const r = await fetch('/api/adsb?' + p.toString(), { cache: 'no-store' });
      if (!r.ok) throw new Error(r.statusText);
      const d = await r.json();
      ensureTilesMatch(d.web_tiles);
      clearAll();
      renderAircraft(d.aircraft || []);
      drawReceiver(d.receiver);
      fitToAircraft();
      restoreSelection();
      document.getElementById('ac-count').textContent = (d.aircraft || []).length;
      document.getElementById('log-state').textContent = d.logging ? 'ON' : 'off';
      document.getElementById('window-label').textContent = humanWindow(d.window || w);
      document.getElementById('tiles-label').textContent =
        (d.web_tiles && d.web_tiles.name) || '—';
      // Farthest signal (only when receiver location is configured).
      // Clickable: selects the aircraft on the globe + zooms to it.
      const fEl = document.getElementById('farthest');
      if (d.farthest) {
        fEl.textContent =
          `${fmtDist(d.farthest.distance_km)}` +
          ` (${d.farthest.callsign || d.farthest.icao})`;
        fEl.dataset.icao = d.farthest.icao;
        fEl.classList.add('clickable');
        fEl.title = 'Click to select this aircraft on the globe';
      } else {
        fEl.dataset.icao = '';
        fEl.classList.remove('clickable');
        fEl.title = '';
        fEl.textContent = d.receiver
          ? '(no located aircraft in window)'
          : '(set location_lat/lon in preset)';
      }
    } catch (e) {
      document.getElementById('log-state').textContent = 'error: ' + e.message;
    } finally {
      btn.disabled = false;
    }
  }

  const sel = document.getElementById('window-select');
  const cust = document.getElementById('custom-range');
  sel.addEventListener('change', () => {
    cust.style.display = sel.value === 'custom' ? 'block' : 'none';
    if (sel.value !== 'custom') refresh();
  });
  document.getElementById('refresh-btn').addEventListener('click', refresh);
  document.getElementById('range-from').addEventListener('change', refresh);
  document.getElementById('range-to')  .addEventListener('change', refresh);

  // Click the "Farthest: X km (CALL)" line to jump to and select that plane.
  document.getElementById('farthest').addEventListener('click', function() {
    const icao = this.dataset.icao;
    if (!icao) return;
    const entity = acDS.entities.getById(icao);
    if (!entity) return;
    viewer.selectedEntity = entity;      // fires selectedEntityChanged →
                                          // opens popup, highlights track red,
                                          // draws route if callsign is known
    viewer.flyTo(entity, { duration: 1.2 });
  });

  refresh();
</script>
</body>
</html>
