[project]
name = "rtl-sdr-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyrtlsdr",
    "numpy",
    "scipy",
    "sounddevice",
